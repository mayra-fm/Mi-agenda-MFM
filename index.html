const DAY_NAMES = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const DAY_NAMES_FULL = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const MONTH_NAMES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"];
const pad = n => String(n).padStart(2, "0");
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const sameDay = (a, b) => toKey(a) === toKey(b);
const addDays = (d, n) => {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
};
const startOfWeek = d => {
  const r = new Date(d);
  const dow = (r.getDay() + 6) % 7;
  return addDays(r, -dow);
};
function keysInRange(startKey, endKey) {
  const out = [];
  let d = fromKey(startKey);
  const end = fromKey(endKey);
  let guard = 0;
  while (toKey(d) <= toKey(end) && guard < 90) {
    out.push(toKey(d));
    d = addDays(d, 1);
    guard++;
  }
  return out;
}
function shortDate(key) {
  const d = fromKey(key);
  return `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0, 3).toLowerCase()}`;
}
function formatWhen(ev) {
  const end = ev.endDate || ev.date;
  const multiDay = end !== ev.date;
  const datePart = multiDay ? `${shortDate(ev.date)} – ${shortDate(end)}` : shortDate(ev.date);
  let timePart = "";
  if (ev.time && ev.endTime) timePart = `${ev.time}–${ev.endTime}`;else if (ev.time) timePart = ev.time;
  return timePart ? `${datePart} · ${timePart}` : datePart;
}
const RECUR_LABELS = {
  none: "No repetir",
  daily: "Cada día",
  weekly: "Cada semana",
  monthly: "Cada mes",
  yearly: "Cada año"
};
function recurrenceLabel(rec) {
  if (!rec || !rec.freq || rec.freq === "none") return "";
  const interval = rec.interval || 1;
  const base = interval === 1 ? RECUR_LABELS[rec.freq] : `Cada ${interval} ${{
    daily: "días",
    weekly: "semanas",
    monthly: "meses",
    yearly: "años"
  }[rec.freq]}`;
  return rec.until ? `${base} (hasta ${shortDate(rec.until)})` : base;
}
function occursOnDate(ev, d) {
  const k = toKey(d);
  const rec = ev.recurrence;
  if (!rec || !rec.freq || rec.freq === "none") {
    const end = ev.endDate || ev.date;
    return k >= ev.date && k <= end;
  }
  if (k < ev.date) return false;
  if (rec.until && k > rec.until) return false;
  const start = fromKey(ev.date);
  const target = fromKey(k);
  const interval = rec.interval || 1;
  const MS_DAY = 86400000;
  if (rec.freq === "daily") {
    const diffDays = Math.round((target - start) / MS_DAY);
    return diffDays % interval === 0;
  }
  if (rec.freq === "weekly") {
    if (target.getDay() !== start.getDay()) return false;
    const diffWeeks = Math.round((target - start) / (7 * MS_DAY));
    return diffWeeks % interval === 0;
  }
  if (rec.freq === "monthly") {
    if (target.getDate() !== start.getDate()) return false;
    const diffMonths = (target.getFullYear() - start.getFullYear()) * 12 + (target.getMonth() - start.getMonth());
    return diffMonths >= 0 && diffMonths % interval === 0;
  }
  if (rec.freq === "yearly") {
    if (target.getDate() !== start.getDate() || target.getMonth() !== start.getMonth()) return false;
    const diffYears = target.getFullYear() - start.getFullYear();
    return diffYears >= 0 && diffYears % interval === 0;
  }
  return false;
}
function timeRangeOf(ev) {
  const [h, m] = ev.time.split(":").map(Number);
  let dur = 45;
  if (ev.endTime) {
    const [eh, em] = ev.endTime.split(":").map(Number);
    const s = h * 60 + m,
      e = eh * 60 + em;
    if (e > s) dur = e - s;
  }
  const start = h * 60 + m;
  return {
    start,
    end: start + dur
  };
}
function findConflicts(candidate, allEvents, targetDate) {
  if (!candidate.time) return [];
  const cand = timeRangeOf(candidate);
  const d = fromKey(targetDate);
  return allEvents.filter(ev => {
    if (ev.id === candidate.id || !ev.time) return false;
    if (!occursOnDate(ev, d)) return false;
    const r = timeRangeOf(ev);
    return cand.start < r.end && r.start < cand.end;
  });
}

/* reparte eventos que se cruzan en "carriles" lado a lado para la vista semanal/diaria */
function layoutTimedEvents(events) {
  const withRange = events.map(ev => ({
    ev,
    ...timeRangeOf(ev)
  })).sort((a, b) => a.start - b.start || a.end - b.end);
  const clusters = [];
  let current = [],
    clusterEnd = -Infinity;
  withRange.forEach(item => {
    if (current.length && item.start >= clusterEnd) {
      clusters.push(current);
      current = [];
      clusterEnd = -Infinity;
    }
    current.push(item);
    clusterEnd = Math.max(clusterEnd, item.end);
  });
  if (current.length) clusters.push(current);
  const result = [];
  clusters.forEach(cluster => {
    const lanesEnd = [];
    cluster.forEach(item => {
      let lane = lanesEnd.findIndex(endT => endT <= item.start);
      if (lane === -1) {
        lane = lanesEnd.length;
        lanesEnd.push(item.end);
      } else lanesEnd[lane] = item.end;
      item.lane = lane;
    });
    const totalLanes = lanesEnd.length;
    cluster.forEach(item => result.push({
      ...item,
      totalLanes
    }));
  });
  return result;
}

/* ---------- compresión de imagen (para caber en Firestore, límite 1MB por documento) ---------- */
function compressImage(file, maxDim = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let {
          width,
          height
        } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"

    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens,
      messages: [{
        role: "user",
        content: contentBlocks
      }]
    })
  });

  return JSON.parse(cleaned);
}
